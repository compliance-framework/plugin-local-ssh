# Publishes the plugin (goreleaser archives + gooci upload) when a release is published.
name: release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release:
    uses: compliance-framework/workflows/.github/workflows/release-go-plugin.yml@dc7434879fbd0db1d1df9f590ed8bc13789bd320 # v1.9.2
    with:
      protocol-version: "2"
    permissions:
      contents: write # goreleaser attaches the archives to the release
      packages: write
    secrets: inherit
