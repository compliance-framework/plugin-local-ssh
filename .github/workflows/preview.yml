# Publishes :pr-<number> previews for PRs labelled `preview` (no :main previews for plugins).
name: preview

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  # A merged PR's events carry the base branch as github.ref, so key PR runs by number.
  group: preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    uses: compliance-framework/workflows/.github/workflows/preview.yml@05d2c3233de6e302c4ff891dde1132d440c081e4 # v1.6.0
    with:
      kind: go-plugin
      on-main: false
    permissions:
      contents: read
      packages: write
