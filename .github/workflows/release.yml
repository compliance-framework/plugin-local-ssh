# Publishes the plugin (goreleaser archives + gooci upload) when a release is published.
name: release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release:
    uses: compliance-framework/workflows/.github/workflows/release-go-plugin.yml@05d2c3233de6e302c4ff891dde1132d440c081e4 # v1.6.0
    with:
      protocol-version: "2"
    permissions:
      contents: write # goreleaser attaches the archives to the release
      packages: write
    secrets: inherit
